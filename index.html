<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon-wrap">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h1>Lua Script Loadstring Generator</h1>
            <p>วางสคริปต์ Lua เพื่ออัปโหลดและแปลงเป็น Loadstring ทันที</p>
        </div>

        <!-- Notification Box -->
        <div id="alertBox" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alertMessage">รหัสผ่านไม่ถูกต้อง!</span>
        </div>

        <!-- Form -->
        <div class="form-group">
            <label for="luaScript">
                <span>Lua Script Code</span>
                <span style="font-size: 0.75rem; color: #64748b;">(วางโค้ดสคริปต์เต็มได้ที่นี่)</span>
            </label>
            <textarea id="luaScript" class="input-control" placeholder="-- วางโค้ด Rayfield UI หรือ Lua Script ของคุณที่นี่..."></textarea>
        </div>

        <div class="form-group">
            <label for="accessKey">Access Key (รหัสผ่าน)</label>
            <div class="input-wrapper">
                <input type="password" id="accessKey" class="input-control" placeholder="กรอกรหัสผ่านเพื่ออนุมัติการสร้าง" autocomplete="off">
                <i class="fa-solid fa-key"></i>
            </div>
        </div>

        <button id="btnStart" class="btn-submit">
            <i class="fa-solid fa-play" id="btnIcon"></i>
            <span id="btnText">Start & Generate Loadstring</span>
        </button>

        <!-- Result Box -->
        <div id="resultSection" class="result-section">
            <div class="result-header">
                <span class="result-title">
                    <i class="fa-solid fa-circle-check"></i> Loadstring พร้อมใช้งาน
                </span>
            </div>
            <div class="code-box">
                <div id="codeResult" class="code-content"></div>
            </div>
            <button id="btnCopy" class="btn-copy">
                <i class="fa-regular fa-copy" id="copyIcon"></i>
                <span id="copyText">คัดลอกผลลัพธ์</span>
            </button>
        </div>
    </div>

    <script>
        // กำหนด Access Key ที่ถูกต้อง (สามารถแก้ไขได้ตามต้องการ)
        const CORRECT_KEY = "VIP-KEY-8888";

        // Element Referencing
        const luaScriptInput = document.getElementById('luaScript');
        const accessKeyInput = document.getElementById('accessKey');
        const btnStart = document.getElementById('btnStart');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alertBox');
        const alertMessage = document.getElementById('alertMessage');
        const resultSection = document.getElementById('resultSection');
        const codeResult = document.getElementById('codeResult');
        const btnCopy = document.getElementById('btnCopy');
        const copyIcon = document.getElementById('copyIcon');
        const copyText = document.getElementById('copyText');

        // ฟังก์ชันแสดงการแจ้งเตือน
        function showAlert(msg) {
            alertMessage.textContent = msg;
            alertBox.style.display = 'flex';
        }

        // ฟังก์ชันซ่อนการแจ้งเตือน
        function hideAlert() {
            alertBox.style.display = 'none';
        }

        // ฟังก์ชันแสดงสถานะกำลังโหลด
        function setLoading(isLoading) {
            if (isLoading) {
                btnStart.disabled = true;
                btnIcon.className = "fa-solid fa-spinner spinner";
                btnText.textContent = "กำลังอัปโหลดและประมวลผล...";
            } else {
                btnStart.disabled = false;
                btnIcon.className = "fa-solid fa-play";
                btnText.textContent = "Start & Generate Loadstring";
            }
        }

        // ฟังก์ชันอัปโหลดสคริปต์ไปยัง Cloud Paste Service
        async function uploadScriptToCloud(scriptCode) {
            // ใช้ API ของ Bytebin (Lucko) ซึ่งรองรับ CORS และเสถียรมากสำหรับ Raw text
            const response = await fetch('https://bytebin.lucko.me/post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain; charset=utf-8'
                },
                body: scriptCode
            });

            if (!response.ok) {
                throw new Error('ไม่สามารถอัปโหลดสคริปต์ได้');
            }

            const data = await response.json();
            // จะได้ Raw URL กลับมา เช่น https://bytebin.lucko.me/KEY_ID
            return `https://bytebin.lucko.me/${data.key}`;
        }

        // เมื่อกดปุ่ม Start
        btnStart.addEventListener('click', async () => {
            const script = luaScriptInput.value.trim();
            const key = accessKeyInput.value.trim();

            hideAlert();
            resultSection.style.display = 'none';

            // 1. ตรวจสอบการกรอกข้อมูล
            if (!script) {
                showAlert('กรุณาวางโค้ดสคริปต์ Lua ในช่องข้อความ');
                return;
            }

            if (!key) {
                showAlert('กรุณากรอก Access Key (รหัสผ่าน)');
                return;
            }

            // 2. ตรวจสอบรหัสผ่าน
            if (key !== CORRECT_KEY) {
                showAlert('Access Key ไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง');
                return;
            }

            // 3. เริ่มการอัปโหลดโค้ดไปยัง Server
            setLoading(true);

            try {
                const rawUrl = await uploadScriptToCloud(script);
                
                // 4. สร้างคำสั่ง loadstring
                const generatedLoadstring = `loadstring(game:HttpGet("${rawUrl}"))()`;
                codeResult.textContent = generatedLoadstring;

                // แสดงส่วนผลลัพธ์
                resultSection.style.display = 'block';
            } catch (error) {
                showAlert('เกิดข้อผิดพลาดในการสร้างลิงก์: ' + error.message);
            } finally {
                setLoading(false);
            }
        });

        // ฟังก์ชันคัดลอกข้อความ
        btnCopy.addEventListener('click', () => {
            const textToCopy = codeResult.textContent;
            if (!textToCopy) return;

            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();

            try {
                document.execCommand('copy');
                
                btnCopy.classList.add('copied');
                copyIcon.className = 'fa-solid fa-check';
                copyText.textContent = 'คัดลอกเรียบร้อยแล้ว!';

                setTimeout(() => {
                    btnCopy.classList.remove('copied');
                    copyIcon.className = 'fa-regular fa-copy';
                    copyText.textContent = 'คัดลอกผลลัพธ์';
                }, 2000);
            } catch (err) {
                showAlert('ไม่สามารถคัดลอกได้ กรุณาลองคัดลอกด้วยตนเอง');
            }

            document.body.removeChild(textArea);
        });
    </script>
</body>
</html>
